name: CI Build
on: workflow_dispatch
jobs:
  build:
    name: Build fairseq (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip wheel https://github.com/VarunGumma/fairseq/archive/refs/heads/main.zip
        continue-on-error: true
      - uses: actions/upload-artifact@v5
        with:
          name: fairseq-wheel-${{ matrix.python-version }}
          path: fairseq-*.whl
          if-no-files-found: ignore
